<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Countdown</title>
<style>
  table.countdown-table {
    border-collapse: collapse;
    background: #000;
    color: #fff;
    border: 1px solid #ddd;
    font-family: Arial, sans-serif;
    text-align: center;
    width: 100%;
    max-width: 500px;
    margin: auto;
  }
  table.countdown-table th {
    font-size: 15pt;
    border: 1px solid #ddd;
    width: 30%;
    padding: 10px;
  }
  table.countdown-table td {
    border: 1px solid #ddd;
    padding: 10px;
  }
  .countdown-top {
    font-size: 1.25em;
    font-weight: bold;
    margin-bottom: 4px;
  }
  .countdown-bottom {
    font-size: 2.1em;
    font-family: "Comic Neue", sans-serif;
  }
</style>
</head>
<body>
<table class="countdown-table">
  <tr>
    <th>Global Schedule</th>
    <td>
      <div class="countdown-top" id="phase">Loading...</div>
      <div class="countdown-bottom" id="timer">--:--:--</div>
    </td>
  </tr>
</table>

<script>
(function() {
  const elTimer = document.getElementById("timer");
  const elPhase = document.getElementById("phase");

  const dailyPhases = [
    { name: "Mid-Day Phase", windows: [{start: "08:00", end: "09:00"}, {start: "20:00", end: "21:00"}] },
    { name: "Night Phase", windows: [{start: "01:00", end: "02:00"}, {start: "13:00", end: "14:00"}] }
  ];

  function parseTime(timeStr) {
    const [h,m] = timeStr.split(":").map(Number);
    return {h,m};
  }

  function update() {
    const now = new Date();
    const nowUTC = new Date(now.getTime() + now.getTimezoneOffset() * 60000);
    
    let currentPhase = null;
    let timeLeft = 0;

    for (let phase of dailyPhases) {
      for (let window of phase.windows) {
        const startT = parseTime(window.start);
        const endT = parseTime(window.end);

        const start = new Date(Date.UTC(
          nowUTC.getUTCFullYear(), nowUTC.getUTCMonth(), nowUTC.getUTCDate(),
          startT.h, startT.m, 0
        ));
        const end = new Date(Date.UTC(
          nowUTC.getUTCFullYear(), nowUTC.getUTCMonth(), nowUTC.getUTCDate(),
          endT.h, endT.m, 0
        ));

        if (nowUTC >= start && nowUTC < end) {
          currentPhase = phase;
          timeLeft = end - nowUTC;
          break;
        }

        if (nowUTC < start && (!currentPhase || start < currentPhase.nextStart)) {
          currentPhase = {...phase, nextStart: start};
          timeLeft = start - nowUTC;
        }
      }
      if (currentPhase && currentPhase.nextStart && timeLeft > 0) break;
    }

    elPhase.textContent = currentPhase.name;

    const h = Math.floor(timeLeft / 3600000);
    const m = Math.floor((timeLeft % 3600000) / 60000);
    const s = Math.floor((timeLeft % 60000) / 1000);

    elTimer.textContent =
      (h > 0 ? h + "h " : "") +
      String(m).padStart(2,"0") + "m " +
      String(s).padStart(2,"0") + "s";
  }

  update();
  setInterval(update, 1000);
})();
</script>
